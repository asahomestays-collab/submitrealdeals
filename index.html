<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Real Deals</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    background-color: #05050a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    padding-bottom: 32px;
    box-sizing: border-box;
    min-height: 100vh;
  }
  .partner-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    padding: 0 20px;
    margin-bottom: 28px;
  }
  .partner-header img {
    display: block;
  }
  #shepherd-logo {
    height: 90px;
    width: auto;
  }
  #x-divider {
    font-size: 34px;
    font-weight: 700;
    color: #d4af6a;
    line-height: 1;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #real-logo-plate {
    background: #ffffff;
    border-radius: 14px;
    padding: 10px 18px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
  }
  #real-logo {
    height: 62px;
    width: auto;
  }
  #form-embed {
    width: 92vw;
    max-width: 900px;
    height: 75vh;
    border: none;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
  }
  @media (max-width: 600px) {
    body {
      padding-top: 24px;
    }
    #shepherd-logo {
      height: 60px;
    }
    #real-logo {
      height: 40px;
    }
    #x-divider {
      font-size: 24px;
    }
    .partner-header {
      gap: 14px;
      margin-bottom: 20px;
    }
  }
</style>
</head>
<body>
  <div class="partner-header">
    <img id="shepherd-logo" src="logo.png" alt="Shepherd Home Advisors">
    <span id="x-divider">&times;</span>
    <div id="real-logo-plate">
      <img id="real-logo" src="real-logo.png" alt="Real">
    </div>
  </div>
  <iframe id="form-embed" src="https://docs.google.com/forms/d/e/1FAIpQLSfyctSx1j43F4zvPl67xU6XN0Nq6x7UxnL0dtdqmzPw_GDpew/viewform?embedded=true" title="Submit Real Deals">Loading…</iframe>
</body>
</html>
